# Centrally-managed tfsec exclusions. Inline #tfsec:ignore comments are also
# left in the flagged resources for context (they document *why* right next
# to the code), but this file is the mechanism that actually enforces the
# exclusion in CI -- inline ignore-comment attribution proved unreliable
# against this codebase's multi-resource module files in tfsec v1.28.14
# (verified by isolating and bisecting the exact same content in a scratch
# directory: identical comments worked or didn't depending on unrelated
# content elsewhere in the file). Every ID below is scoped to a specific,
# already-reviewed set of resources -- see infrastructure/modules/*/main.tf
# for the per-resource rationale.
exclude:
  # ALB and CloudFront are this project's intentional, required public entry
  # point (Web tier must be internet-accessible per the assignment). Nothing
  # behind them (web/api/postgres security groups) is publicly reachable.
  - aws-ec2-no-public-ingress-sgr # modules/security: ALB ingress on 80/443
  - aws-elb-alb-not-public # modules/alb: aws_lb.this
  - aws-elb-http-not-used # modules/alb: HTTP listener, only when certificate_arn is unset

  # Web/API tiers have no VPC interface endpoints for ECR/Secrets
  # Manager/CloudWatch Logs, so they must reach them over the internet (via
  # NAT) on 443. Adding those endpoints would remove the need for this
  # entirely -- tracked as a documented follow-up, not done here to keep
  # this assignment's scope bounded.
  - aws-ec2-no-public-egress-sgr # modules/security: web/api HTTPS egress

  # Both are strictly a function of certificate_arn being unset (no ACM cert
  # configured for this exercise, see terraform.tfvars.example). Supplying a
  # real cert removes both findings automatically -- no code change needed.
  - aws-cloudfront-use-secure-tls-policy
  - aws-cloudfront-enable-logging # legacy S3/ACL-based delivery skipped in favor of CloudTrail + CloudWatch Logs, which already cover this project's logging requirement

  # This bucket IS CloudTrail's own log destination; access-logging it to a
  # second bucket is a common, low-value accepted-risk skip in practice.
  - aws-s3-enable-bucket-logging # modules/cloudtrail: aws_s3_bucket.trail

  # CloudWatch log-delivery IAM policies (task role, VPC Flow Logs, CloudTrail
  # CloudWatch integration) are scoped to one specific log group each, with a
  # required ":*" suffix for the dynamically-named log streams within it --
  # this is the AWS-documented minimum-privilege pattern; it can't be scoped
  # any tighter since stream names aren't known ahead of time.
  - aws-iam-no-policy-wildcards

  # ECR's encryption_configuration is set at repository creation and is
  # ForceNew -- switching the LIVE web/api repos (which already hold real,
  # scanned images) from AES256 to KMS would destroy and recreate them,
  # deleting every existing image. The kms module and ecr module's
  # kms_key_arn variable both support KMS; it's deliberately left
  # unwired for the live repos. See docs/RUNBOOK.md for the safe migration
  # path (new KMS-encrypted repo + re-push, then cut CI over).
  - aws-ecr-repository-customer-key
