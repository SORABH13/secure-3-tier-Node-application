name: App CI (build & deploy)

on:
  push:
    branches:
      - master
      - feature/project-analysis
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    name: Build, push images and deploy to ECS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build & push Web image
        run: |
          WEB_REPO=${{ secrets.ECR_WEB_REPO }}
          WEB_TAG=${{ github.sha }}
          docker build -t ${WEB_REPO}:${WEB_TAG} -f web/Dockerfile ./web
          docker tag ${WEB_REPO}:${WEB_TAG} ${WEB_REPO}:latest
          docker push ${WEB_REPO}:${WEB_TAG}
          docker push ${WEB_REPO}:latest

      - name: Build & push API image
        run: |
          API_REPO=${{ secrets.ECR_API_REPO }}
          API_TAG=${{ github.sha }}
          docker build -t ${API_REPO}:${API_TAG} -f api/Dockerfile ./api
          docker tag ${API_REPO}:${API_TAG} ${API_REPO}:latest
          docker push ${API_REPO}:${API_TAG}
          docker push ${API_REPO}:latest

      - name: Force new deployment (Web)
        if: secrets.ECS_CLUSTER && secrets.ECS_WEB_SERVICE
        run: |
          aws ecs update-service --cluster "${{ secrets.ECS_CLUSTER }}" --service "${{ secrets.ECS_WEB_SERVICE }}" --force-new-deployment

      - name: Force new deployment (API)
        if: secrets.ECS_CLUSTER && secrets.ECS_API_SERVICE
        run: |
          aws ecs update-service --cluster "${{ secrets.ECS_CLUSTER }}" --service "${{ secrets.ECS_API_SERVICE }}" --force-new-deployment
