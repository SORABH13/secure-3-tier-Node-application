name: Deploy application

on:
  push:
    branches:
      - master
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the images to existing ECS services
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-application-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: toptal
  ENVIRONMENT: prod

jobs:
# Test for application services (API and web) using Jest in CI mode.
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    defaults:
      run:
        working-directory: app/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
 
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/${{ matrix.service }}/package-lock.json
 
      - name: Install dependencies
        run: npm ci
 
      - name: Run tests
        run: npx jest --ci

  build-push-deploy:
    name: Build, publish, and deploy ECS services
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set deployment values
        id: deployment
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "web_repository=${REGISTRY}/${PROJECT_NAME}-${ENVIRONMENT}-web" >> "$GITHUB_OUTPUT"
          echo "api_repository=${REGISTRY}/${PROJECT_NAME}-${ENVIRONMENT}-api" >> "$GITHUB_OUTPUT"
          echo "cluster=${PROJECT_NAME}-${ENVIRONMENT}-cluster" >> "$GITHUB_OUTPUT"
          echo "web_service=${PROJECT_NAME}-${ENVIRONMENT}-web" >> "$GITHUB_OUTPUT"
          echo "api_service=${PROJECT_NAME}-${ENVIRONMENT}-api" >> "$GITHUB_OUTPUT"

      - name: Confirm ECR repositories exist
        run: |
          aws ecr describe-repositories --repository-names \
            "${PROJECT_NAME}-${ENVIRONMENT}-web" \
            "${PROJECT_NAME}-${ENVIRONMENT}-api"

      - name: Build and push web image
        env:
          IMAGE: ${{ steps.deployment.outputs.web_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$IMAGE:$IMAGE_TAG" app/web
          docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:latest"
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"

      - name: Build and push API image
        env:
          IMAGE: ${{ steps.deployment.outputs.api_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$IMAGE:$IMAGE_TAG" app/api
          docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:latest"
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"

      - name: Verify ECS services use the expected images
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        env:
          CLUSTER: ${{ steps.deployment.outputs.cluster }}
          WEB_SERVICE: ${{ steps.deployment.outputs.web_service }}
          API_SERVICE: ${{ steps.deployment.outputs.api_service }}
          WEB_IMAGE: ${{ steps.deployment.outputs.web_repository }}:latest
          API_IMAGE: ${{ steps.deployment.outputs.api_repository }}:latest
        run: |
          get_image() {
            local service="$1"
            local container="$2"
            local task_definition
            task_definition=$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" --query 'services[0].taskDefinition' --output text)
            aws ecs describe-task-definition --task-definition "$task_definition" --query "taskDefinition.containerDefinitions[?name=='$container'].image | [0]" --output text
          }

          test "$(get_image "$WEB_SERVICE" web)" = "$WEB_IMAGE"
          test "$(get_image "$API_SERVICE" api)" = "$API_IMAGE"

      - name: Deploy ECS services
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        env:
          CLUSTER: ${{ steps.deployment.outputs.cluster }}
          WEB_SERVICE: ${{ steps.deployment.outputs.web_service }}
          API_SERVICE: ${{ steps.deployment.outputs.api_service }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$WEB_SERVICE" --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER" --service "$API_SERVICE" --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$WEB_SERVICE" "$API_SERVICE"
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed -- rolling back to ${{ steps.previous.outputs.task_def }}"
          aws ecs update-service \
            --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "${{ steps.previous.outputs.task_def }}" \
            --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Rollback complete."
          exit 1
  # -------------------------------------------------------------------
  # SMOKE TEST -- actually hits the running app, not just a string
  # comparison of task definition JSON.
  # -------------------------------------------------------------------
  smoke-test:
    name: Smoke test
    needs: build-push-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Hit web and api endpoints
        run: |
          sleep 15
          curl -f http://toptal-prod-alb-1538163913.us-east-1.elb.amazonaws.com/ \
            || (echo "web smoke test failed" && exit 1)
          # curl -f http://toptal-prod-alb-1538163913.us-east-1.elb.amazonaws.com/api/status \
          #   || (echo "api smoke test failed" && exit 1)
          echo "Smoke tests passed."
           