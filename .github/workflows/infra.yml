name: Infra CI

on:
  push:
    branches:
      - master
      - feature/project-analysis
    paths:
      - "infrastructure/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infrastructure/environments/prod

jobs:
  terraform-security-scan:
    name: Terraform security scan (tfsec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # tfsec-action cd's into $GITHUB_WORKSPACE (repo root), not
          # working_directory, then passes working_directory as tfsec's scan
          # target -- so additional_args paths resolve from the repo root too.
          additional_args: --config-file infrastructure/.tfsec/config.yml

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-security-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # terraform.tfvars is gitignored on purpose (it used to hold a
      # plaintext DB password before random_password.db took over -- see
      # main.tf). Every remaining value in it is non-sensitive and identical
      # to terraform.tfvars.example, so CI just uses the example directly
      # rather than needing a secret-backed copy of the file.
      - name: Prepare tfvars
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: cp terraform.tfvars.example terraform.tfvars

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        id: tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -var-file="terraform.tfvars" -out=tfplan

      - name: Upload tfplan
        id: upload-plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          # Plan output can contain sensitive values (e.g. generated DB
          # password) in plaintext -- keep it out of long-term retention.
          retention-days: 1

  approval:
    name: Manual approval
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production
    steps:
      - name: Awaiting approval
        run: echo "Terraform plan is ready. Approve the deployment in GitHub environment protections."

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-plan, approval]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download tfplan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan
