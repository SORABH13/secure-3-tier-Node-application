name: OIDC Diagnostic

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  oidc-test:
    name: OIDC AssumeRole Diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Show environment variables (sanitized)
        run: |
          echo "--- Selected secrets presence ---"
          if [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then echo "AWS_ROLE_TO_ASSUME is set"; else echo "AWS_ROLE_TO_ASSUME is NOT set"; fi
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then echo "AWS_ACCESS_KEY_ID is set"; else echo "AWS_ACCESS_KEY_ID is NOT set"; fi
          echo "GITHUB_REPOSITORY=${{ github.repository }}"
          echo "GITHUB_REF=${{ github.ref }}"

      - name: Print AWS caller identity
        run: |
          echo "--- aws sts get-caller-identity ---"
          aws sts get-caller-identity || echo "sts call failed"

      - name: Dump AWS env vars
        run: env | sort | sed -n '1,200p'
